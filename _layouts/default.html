<!doctype html>
<html lang="{{ page.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script>
    /* Applies the saved theme before first paint. */
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.ga_id }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ site.ga_id }}');
  </script>

  <!-- SEO / indexing -->
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
{% if page.alt_url %}  <link rel="alternate" hreflang="{{ page.lang }}" href="{{ site.url }}{{ page.url }}">
  <link rel="alternate" hreflang="{{ page.alt_lang }}" href="{{ site.url }}{{ page.alt_url }}">
  <link rel="alternate" hreflang="x-default" href="{{ site.url }}/">
{% endif %}

  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <meta name="author" content="{{ site.author }}">

  <meta property="og:type" content="profile">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:locale" content="{{ page.og_locale }}">
  <!-- Once a photo exists, add it here and the same file becomes the social preview:
  <meta property="og:image" content="{{ site.url }}/assets/img/og-image.jpg"> -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title }}">
  <meta name="twitter:description" content="{{ page.description }}">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23111'/%3E%3Ctext x='32' y='44' font-family='Arial,Helvetica,sans-serif' font-size='34' font-weight='700' fill='%23fff' text-anchor='middle'%3EDK%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400..600&display=swap">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/site.css">
</head>

<body class="page-{{ page.nav }}">
  <a class="skip-link" href="#content">Skip to main content</a>

  <header>
    <div class="wrap nav">
      <a class="brand" href="{{ site.baseurl }}/">Dong-Geon Kim</a>
      <nav id="site-nav" aria-label="Primary navigation">
        <a href="{{ site.baseurl }}/research/">Research</a>
        <a href="{{ site.baseurl }}/publications/">Publications</a>
        <a href="{{ site.baseurl }}/cv/">CV</a>
      </nav>
      <div class="nav-actions">
        <button class="theme-toggle" type="button" aria-label="Switch colour theme" title="Switch colour theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.6 6.6 0 0 0 10.5 10.5Z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M4.2 12H2M22 12h-2.2M6.5 6.5 4.9 4.9M19.1 19.1l-1.6-1.6M17.5 6.5l1.6-1.6M4.9 19.1l1.6-1.6"/></svg>
        </button>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
      </div>
    </div>
  </header>

  <main id="content">
{{ content }}
  </main>

  <footer>
    <div class="wrap">
      <div class="footer-nav">
        <a href="{{ site.baseurl }}/">Home</a>
        <a href="{{ site.baseurl }}/research/">Research</a>
        <a href="{{ site.baseurl }}/publications/">Publications</a>
        <a href="{{ site.baseurl }}/cv/">CV</a>
        <a href="mailto:{{ site.email }}">{{ site.email }}</a>
        <a href="{{ site.orcid_url }}" rel="me noopener noreferrer" target="_blank">ORCID</a>
        <a href="{{ site.scholar_url }}" rel="me noopener noreferrer" target="_blank">Google Scholar</a>
        <a href="{{ site.researchgate_url }}" rel="me noopener noreferrer" target="_blank">ResearchGate</a>
      </div>
      © <span id="year"></span> Dong-Geon Kim
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    (function () {
      var toggle = document.querySelector(".nav-toggle");
      var nav = document.getElementById("site-nav");
      if (!toggle || !nav) return;
      function setOpen(open) {
        nav.classList.toggle("is-open", open);
        toggle.setAttribute("aria-expanded", String(open));
      }
      toggle.addEventListener("click", function () {
        setOpen(toggle.getAttribute("aria-expanded") !== "true");
      });
      nav.addEventListener("click", function (e) {
        if (e.target.tagName === "A") setOpen(false);
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") setOpen(false);
      });
    })();

    (function () {
      var button = document.querySelector(".theme-toggle");
      var root = document.documentElement;
      if (!button) return;
      function effective() {
        var set = root.getAttribute("data-theme");
        if (set === "light" || set === "dark") return set;
        return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      button.addEventListener("click", function () {
        var next = effective() === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
